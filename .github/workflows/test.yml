name: Test

on:
  push:
    branches: [master, 'port/**']
  pull_request:
    branches: [master, 'port/**']

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Basic library tests
        run: cargo test --locked --lib -p mchprs_blocks -p mchprs_utils
      - name: Plot and interpreter regression tests
        run: |
          cargo test --locked -p mchprs_core --lib -- plot::client_sync_tests::
          cargo test --locked -p mchprs_core --lib -- plot::history::
          cargo test --locked -p mchprs_core --lib -- plot::piston_tests::
          cargo test --locked -p mchprs_core --lib -- plot::command_block_tests::
          cargo test --locked -p mchprs_core --lib -- plot::redpiler_compilation::
      - name: Redpiler and scratch regressions
        run: cargo test --locked -p mchprs_core --lib -- redpiler::
      - name: Headless API regression test
        run: cargo test --locked -p mchprs_core --test headless_api
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check generated registry binaries
        run: |
          python tools/generate_mc_data.py
          git diff --exit-code -- mc_data/1.21.5/registries.bin mc_data/1.21.5/tags.bin
