name: Test

on:
  push:
    branches: [master, 'port/**']
  pull_request:
    branches: [master, 'port/**']

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Basic library tests
        run: cargo test --locked --lib -p mchprs_blocks -p mchprs_utils -p redpiler_graph
      - name: Plot and interpreter regression tests
        run: >-
          cargo test --locked -p mchprs_core --lib --
          plot::client_sync_tests::idle_interpreter
          plot::client_sync_tests::interpreter_stays
          plot::client_sync_tests::wire_input
          plot::history::
          plot::piston_tests::
          plot::command_block_tests::
          plot::redpiler_compilation::
          redpiler::backend::queue::tests::
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check generated registry binaries
        run: |
          python tools/generate_mc_data.py
          git diff --exit-code -- mc_data/1.21.5/registries.bin mc_data/1.21.5/tags.bin
      - name: Python graph loader tests
        run: python -m unittest tools.redpiler_graph.test_loader
      - name: JavaScript graph viewer tests
        run: node --test tools/redpiler-graph-viewer/viewer.test.cjs
