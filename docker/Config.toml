bind_address = "0.0.0.0:25565"
motd = "§4§lmroww.redstoneFUN.pl §r§71.21.5\n§cMinecraft Redstone o Wysokiej Wydajności"
chat_format = "<{username}> {message}"
# Leave public chat and join/leave notices to an external provider.
native_chat = false
# Bridge to the RedBox proxy plugin: positions, teleports, gamemode, and chat.
redbox = true
max_players = 100
view_distance = 8
neighbor_update_interval_ms = 2000
bungeecord = false
whitelist = false
schemati = false
schematic_save_prefix = "./mroww/"
block_in_hitbox = true
auto_redpiler = true
default_tps = 20
fast_render_threshold = 200
fast_render_send_rate = 10
rhistory_memory_limit_mib = 2048
rhistory_work_memory_limit_mib = 256
max_command_ticks = 10000
command_work_time_ms = 250
worldedit_max_blocks = 67108864
worldedit_history_blocks = 134217728

# Optional public waveform API. Keep private and proxy /api/ from the viewer origin.
# Listen on the private Docker network; port 8091 is not published on the host.
waveform_enabled = true
waveform_bind_address = "0.0.0.0:8091"
waveform_public_url = "https://redstonefun.pl/waveform/"
waveform_builder_signals = 16
waveform_builder_ticks = 100
waveform_other_signals = 1024
waveform_other_ticks = 10000
waveform_max_signals = 1024
waveform_max_ticks = 10000
waveform_plot_memory_mib = 32
waveform_memory_mib = 256
waveform_work_memory_mib = 64
waveform_max_records = 500000
waveform_max_text_events = 10000
waveform_text_memory_mib = 4

# Plot Git resource limits (MiB), diff markers and confirmation timeout (seconds).
git_work_memory_mib = 1024
git_plot_storage_mib = 1024
git_default_plot_storage_mib = 100
git_total_storage_mib = 16384
git_snapshot_max_mib = 128
git_marker_limit = 128
git_marker_radius = 64
git_session_seconds = 45

# Velocity modern forwarding; mutually exclusive with bungeecord = true.
[velocity]
secret_file = "/run/velocity/forwarding.secret"

# LuckPerms permissions come from the Velocity proxy (RedBox bridge), not a
# database. The proxy resolves inheritance, wildcards and negations with the
# native LuckPerms API and sends the effective data to this backend.
[luckperms]
source = "redbox"
server_context = "mchprs"
world_context = "redstoneplots"
plotsquared_compat = true
redstonefun_ranks = true
mchprs_permissions = true

# Alternative: read raw nodes directly from a LuckPerms database.
# [luckperms]
# source = "database"
# storage = "postgres"
# host = "localhost"
# port = 5432
