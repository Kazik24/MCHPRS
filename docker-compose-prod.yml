services:
  mroww:
    container_name: mroww
    image: mroww:latest
    build:
      # Cargo/target caches live in the prod server's BuildKit builder.
      context: .
      dockerfile: docker/Dockerfile-plot-scale-5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "16m"
        max-file: "2"
    ports:
      - "25578:25565"
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4.0
    environment:
      MCHPRS_CONFIG: /run/config/Config.toml
    stop_grace_period: 60s
    networks:
      - backend
      - redstonefun
    volumes:
      - /srv/mchprs/data:/data
      - /srv/mchprs/backend-config:/run/config
      - type: bind
        source: /home/minecraft-dev/velocity/data/forwarding.secret
        target: /run/velocity/forwarding.secret
        read_only: true
        bind:
          create_host_path: false
      - /home/minecraft/redstonefun_server/plugins/WorldEdit/schematics:/data/schems/rf:ro

  waveform-viewer:
    image: mroww-waveform-viewer:latest
    build:
      context: ./waveform-viewer
    restart: unless-stopped
    environment:
      WAVEFORM_BACKEND: mroww:8091
    ports:
      - "127.0.0.1:8092:8080"
    networks:
      - backend
      - redstonefun

networks:
  backend:
    internal: true
  redstonefun:
    external: true
    name: redstonefun-network
