services:
  mchprs:
    image: mchprs-mchprs:velocity
    build:
      # Cargo/target caches live in the prod server's BuildKit builder.
      context: .
      dockerfile: docker/Dockerfile-plot-scale-5
    restart: unless-stopped
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4.0
    environment:
      MCHPRS_CONFIG: /run/config/Config.toml
    depends_on:
      velocity:
        condition: service_healthy
    stop_grace_period: 60s
    networks:
      - backend
      - redstonefun
    volumes:
      - /srv/mchprs/data:/data
      - /srv/mchprs/backend-config:/run/config
      - /srv/mchprs/velocity:/run/velocity:ro
      - /home/minecraft/redstonefun_server/plugins/WorldEdit/schematics:/data/schems/rf:ro

  velocity:
    image: mchprs-velocity:4.2.0
    build:
      context: .
      dockerfile: docker/Dockerfile-velocity
    restart: unless-stopped
    environment:
      TYPE: CUSTOM
      CUSTOM_FAMILY: velocity
      BUNGEE_JAR_FILE: /opt/velocity/velocity.jar
      MEMORY: 512m
      # Docker networks on this host have no IPv6 route; keep authentication on IPv4.
      JVM_OPTS: "-Djava.net.preferIPv4Stack=true"
      ENABLE_RCON: "false"
      SERVER_PORT: "25565"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      REPLACE_ENV_DURING_SYNC: "false"
    ports:
      - "25562:25565"
    stop_grace_period: 30s
    networks:
      - default
      - backend
      - redstonefun
    volumes:
      - /srv/mchprs/velocity:/server
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  backend:
    internal: true
  redstonefun:
    external: true
    name: redstonefun-network
