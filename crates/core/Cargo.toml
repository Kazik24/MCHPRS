[package]
name = "mchprs_core"
version = "0.1.0"
authors = ["kazik24", "lord225"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
criterion = "0.4"
mchprs_network = { path = "../network", features = ["test-support"] }

[[bench]]
name = "bitbuffer"
harness = false

[[bench]]
name = "chungus"
harness = false

[[bench]]
name = "piston"
harness = false

[[bench]]
name = "cpus"
harness = false

[[bench]]
name = "instant"
harness = false

[dependencies]
hmac = "0.12"
sha2 = "0.10"
mchprs_proc_macros = { path = "../proc_macros" }
toml = "0.7"
byteorder = "1.4"
hematite-nbt = "0.5"
bitflags = "1.2"
serde = "1"
serde_json = "1.0"
md5 = "0.7"
bus = "2.2"
ctrlc = { version = "3.1", features = ["termination"] }
tracing = "0.1"
chrono = "0.4"
rand = "0.8"
regex = { version = "1.4" }
backtrace = "0.3"
rusqlite = { version="0.28", features=["bundled"] }
anyhow = "1.0"
toml_edit = "0.19"
mysql = "23"
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.11", features = ["json"] }
itertools = "0.10"
impls = "1"
bincode = "1.3"
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-encode", "safe-decode", "checked-decode"] }
crc32fast = "1"
once_cell = "1.14.0"
smallvec = "1.9.0"
petgraph = "0.6"
rustc-hash = "1.1"
rayon = "~1.12.0"
redpiler_graph = { path = "../redpiler_graph" }
mchprs_save_data = { path = "../save_data" }
mchprs_blocks = { path = "../blocks" }
mchprs_world = { path = "../world" }
mchprs_utils = { path = "../utils" }
mchprs_network = { path = "../network" }
postgres = "0.19.14"
