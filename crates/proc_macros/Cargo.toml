[package]
name = "mchprs_proc_macros"
version = "0.1.0"
authors = ["kazik24", "lord225"]
edition = "2018"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "1", features = ["full", "extra-traits"] }
quote = "1"
