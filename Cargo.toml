[workspace]
members = ["crates/proc_macros", "crates/redpiler_graph"]

[package]
name = "mroww"
version = "0.4.1"
authors = ["kazik24", "lord225"]
edition = "2024"
description = "MROWW — Minecraft Redstone o Wysokiej Wydajności. A multithreaded redstone server based on MCHPRS."
readme = "README.md"
license = "MIT"
keywords = ["minecraft", "server", "redstone"]
repository = "https://github.com/Kazik24/MCHPRS"
homepage = "https://github.com/Kazik24/MCHPRS"

include = [
    "**/*.rs",
    "Cargo.toml",
]

[profile.dev]
# MCHPRS runs far too slow without any optimizations to even be usable for testing
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# This seems to speed up Redpiler compile times
lto = "fat"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[features]
default = ["static-log-levels"]
static-log-levels = ["tracing/release_max_level_info", "tracing/max_level_debug"]
graph-trace = ["mchprs_core/graph-trace"]

[dependencies]
mchprs_core = { path = "./crates/core" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing = "0.1"

[patch.crates-io]
hematite-nbt = { git = "https://github.com/StackDoubleFlow/hematite_nbt" }
