services:
  waveform:
    build: .
    ports:
      - "127.0.0.1:8443:8080"
    environment:
      PASSWORD: ${WAVEFORM_PASSWORD:?Set WAVEFORM_PASSWORD before starting}
    volumes:
      - ./workspace:/home/coder/project:ro
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - /home/coder/project
